services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: kkek-backend:latest
    container_name: kkek-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_started

  redis:
    image: redis:7-alpine
    container_name: kkek-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mongodb:
    image: mongo:latest
    container_name: kkek-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=kkek_db
    volumes:
      - mongo-data:/data/db

volumes:
  redis-data:
  mongo-data:
