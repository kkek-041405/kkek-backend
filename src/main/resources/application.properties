server.port=${PORT:8080}
spring.application.name=kkek-backend
spring.main.allow-bean-definition-overriding=true

# MongoDB Configuration (Injected via environment MONGODB_URI)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/kkek_db}

# Redis Configuration (Injected via environment REDIS_HOST / REDIS_PORT)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
